[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_untyped_calls = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4"]
ignore = []
